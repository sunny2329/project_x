<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Podium</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 32px; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="BracketView.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="padding: 4px 10px; border-radius: 6px; background: var(--raised); font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--soft)">EVENT COMPLETE</span>
<a href="PublicTournament.dc.html" aria-label="Share" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></svg></a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; text-align: center">
<span style="font-size: 13px; color: var(--muted)">Jaipur Open 2026 · Open Singles</span>
<h1 class="d" style="margin: 0; font-size: 52px; line-height: 50px; font-weight: 900; text-transform: uppercase">Kabir Mehta<br><span style="color: var(--primary)">is champion</span></h1>
<span class="d" style="font-size: 22px; font-weight: 800; color: var(--soft)">Final 21-18, 17-21, 21-16</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 8px; margin-top: 8px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span class="d" style="width: 60px; height: 60px; border-radius: 30px; background: var(--av3); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900">MR</span>
<span style="font-weight: 700; font-size: 14px; text-align: center">Meenal R</span>
<div style="width: 100%; height: 120px; border-radius: 14px 14px 0 0; background: var(--raised); display: flex; flex-direction: column; align-items: center; padding-top: 10px; box-sizing: border-box"><span class="d" style="font-size: 44px; font-weight: 900; color: var(--soft)">2</span><span style="font-size: 11px; color: var(--muted); font-weight: 700">RUNNER-UP</span></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span style="color: #F5D06B"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/></svg></span>
<span class="d" style="width: 72px; height: 72px; border-radius: 36px; background: var(--av1); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--primary)">KM</span>
<span style="font-weight: 800; font-size: 15px; text-align: center">Kabir M</span>
<div style="width: 100%; height: 170px; border-radius: 14px 14px 0 0; background: var(--primary); color: var(--onPrimary); display: flex; flex-direction: column; align-items: center; padding-top: 10px; box-sizing: border-box"><span class="d" style="font-size: 56px; font-weight: 900">1</span><span style="font-size: 11px; font-weight: 800">CHAMPION</span></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<span class="d" style="width: 60px; height: 60px; border-radius: 30px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900">RS</span>
<span style="font-weight: 700; font-size: 14px; text-align: center">Riya S</span>
<div style="width: 100%; height: 90px; border-radius: 14px 14px 0 0; background: var(--raised); display: flex; flex-direction: column; align-items: center; padding-top: 10px; box-sizing: border-box"><span class="d" style="font-size: 40px; font-weight: 900; color: var(--soft)">3</span><span style="font-size: 11px; color: var(--muted); font-weight: 700">THIRD</span></div>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<a href="BracketView.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; border: 1px solid var(--line2); font-weight: 700; font-size: 15px">Full bracket</a>
<a href="PublicTournament.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 800; font-size: 16px">Share the podium</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

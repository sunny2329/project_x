<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff and courts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 0; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="OrgDashboard.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<h1 class="d" style="margin: 0; font-size: 30px; font-weight: 900; text-transform: uppercase">Staff &amp; courts</h1>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">STAFF · 4</span>
<button style="height: 34px; padding: 0 12px; border-radius: 10px; background: var(--primary); color: var(--onPrimary); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M12 5v14M5 12h14"/></svg>Invite</button>
</div>
<div style="border-radius: 16px; background: var(--surface); overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--raised)"><span style="width: 38px; height: 38px; border-radius: 19px; background: var(--av1); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">KM</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Kabir Mehta (you)</span><span style="font-size: 12px; color: var(--muted)">Can’t be removed</span></span><span style="padding: 4px 8px; border-radius: 6px; background: var(--primary); color: var(--onPrimary); font-size: 11px; font-weight: 800">ORGANIZER</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--raised)"><span style="width: 38px; height: 38px; border-radius: 19px; background: var(--av3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">NS</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Neha S</span><span style="font-size: 12px; color: var(--muted)">Events, entries, draw, courts</span></span><span style="padding: 4px 8px; border-radius: 6px; background: var(--raised); font-size: 11px; font-weight: 800; color: var(--soft)">CO-ORGANIZER</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--raised)"><span style="width: 38px; height: 38px; border-radius: 19px; background: var(--av5); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">DP</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Dev P</span><span style="font-size: 12px; color: var(--muted)">Starts and scores any match</span></span><span style="padding: 4px 8px; border-radius: 6px; background: var(--raised); font-size: 11px; font-weight: 800; color: var(--soft)">REFEREE</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px"><span style="width: 38px; height: 38px; border-radius: 19px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">RS</span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Riya S</span><span style="font-size: 12px; color: var(--muted)">Court 3 only</span></span><span style="padding: 4px 8px; border-radius: 6px; background: var(--raised); font-size: 11px; font-weight: 800; color: var(--soft)">COURT SCORER</span></div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">COURTS · 4</span>
<button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M12 5v14M5 12h14"/></svg>Add court</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="padding: 12px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px"><span class="d" style="font-size: 22px; font-weight: 900">Court 1</span><span style="font-size: 13px; color: var(--muted)">Scorer: any staff</span><button style="align-self: flex-start; font-size: 13px; font-weight: 700; padding: 4px 0">Assign</button></div>
<div style="padding: 12px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px"><span class="d" style="font-size: 22px; font-weight: 900">Court 2</span><span style="font-size: 13px; color: var(--muted)">Scorer: Dev P</span><button style="align-self: flex-start; font-size: 13px; font-weight: 700; padding: 4px 0">Change</button></div>
<div style="padding: 12px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px"><span class="d" style="font-size: 22px; font-weight: 900">Court 3</span><span style="font-size: 13px; color: var(--muted)">Scorer: Riya S</span><button style="align-self: flex-start; font-size: 13px; font-weight: 700; padding: 4px 0">Change</button></div>
<div style="padding: 12px; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px"><span class="d" style="font-size: 22px; font-weight: 900">Court 4</span><span style="font-size: 13px; color: var(--muted)">Scorer: any staff</span><button style="align-self: flex-start; font-size: 13px; font-weight: 700; padding: 4px 0">Assign</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

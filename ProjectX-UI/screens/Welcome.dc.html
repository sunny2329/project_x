<style>
body{margin:0}

.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>

<div style="display: flex; align-items: center; justify-content: space-between">

<span style="width: 10px; height: 10px; border-radius: 5px; background: #F97316"></span>

<div style="position: relative; height: 236px">

<span style="padding: 3px 8px; border-radius: 6px; background: #FF5468; color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: 0.08em">LIVE</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #A855F7"></span>
<span style="flex: 1; font-weight: 600; font-size: 16px">Riya &amp; Kabir</span>
<span class="d" style="font-size: 20px; color: var(--muted); width: 24px; text-align: center">1</span>
<span class="d" style="font-size: 44px; font-weight: 900; line-height: 44px; width: 56px; text-align: right">20</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 8px; height: 8px"></span>
<span style="flex: 1; font-weight: 600; font-size: 16px; color: var(--soft)">Arjun &amp; Meera</span>
<span class="d" style="font-size: 20px; color: var(--muted); width: 24px; text-align: center">1</span>
<span class="d" style="font-size: 44px; font-weight: 900; line-height: 44px; width: 56px; text-align: right; color: var(--soft)">18</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px">
<span class="d" style="font-size: 22px; font-weight: 800; letter-spacing: 0.06em; color: var(--tBad)">MATCH POINT</span>
<span style="font-size: 12px; color: var(--muted)">21-17, 18-21</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h1 class="d" style="margin: 0; font-size: 58px; line-height: 54px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.005em">Tap who won the point. <span style="color: var(--accentText)">We do the rest.</span></h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--muted)">Scores, serves, brackets, standings and ratings for badminton, table tennis, pickleball, padel and tennis.</p>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="SignupPhone.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Get started</a>
<a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; border: 1px solid var(--line2); font-weight: 600; font-size: 16px">I already have an account</a>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>

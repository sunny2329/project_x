<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Post and comments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font-size: 17px; font-weight: 700">Post</span>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--raised)">
<a href="PlayerProfile.dc.html" style="display: flex; align-items: center; gap: 10px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: var(--av3); display: flex; align-items: center; justify-content: center; font-weight: 700">NS</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Neha S</span><span style="font-size: 13px; color: var(--muted)">@neha.s · 5h ago</span></span>
</a>
<p style="margin: 0; font-size: 17px; line-height: 26px">Looking for a padel partner for Sunday 7am at Courtyard. 4.0 level, happy to rotate sides.</p>
<div style="display: flex; gap: 10px">
<button aria-pressed="true" style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: rgba(255,84,104,0.14); color: var(--bad); font-size: 14px; font-weight: 700"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>12</button>
<button style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 600"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>3</button>
<button aria-label="Share" style="margin-left: auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: var(--surface)"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 10px">
<span style="width: 34px; height: 34px; flex: none; border-radius: 17px; background: var(--av1); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">KM</span>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px"><b>Kabir M</b> <span style="color: var(--muted)">· 4h</span></span><span style="font-size: 15px; line-height: 22px">I’m in. Left side?</span></div>
</div>
<div style="display: flex; gap: 10px">
<span style="width: 34px; height: 34px; flex: none; border-radius: 17px; background: var(--av3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">NS</span>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px"><b>Neha S</b> <span style="color: var(--muted)">· 4h</span></span><span style="font-size: 15px; line-height: 22px">Perfect. I’ll book court 3.</span></div>
</div>
<div style="display: flex; gap: 10px">
<span style="width: 34px; height: 34px; flex: none; border-radius: 17px; background: var(--av5); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">IR</span>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px"><b>Ishaan R</b> <span style="color: var(--muted)">· 2h</span></span><span style="font-size: 15px; line-height: 22px">Score it on the app so we see the golden points.</span></div>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 30px; border-top: 1px solid var(--raised); background: var(--bar)">
<label for="pd-c" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Add a comment</label>
<input id="pd-c" placeholder="Add a comment" style="flex: 1; height: 46px; padding: 0 16px; border-radius: 23px; background: var(--surface); border: 1px solid var(--line); font-size: 15px">
<button aria-label="Send" style="width: 46px; height: 46px; border-radius: 23px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

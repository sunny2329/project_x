<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;resize:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 28px; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Profile.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: var(--muted)">Cancel</a>
<span style="font-size: 17px; font-weight: 700">Edit profile</span>
<a href="Profile.dc.html" style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 12px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 15px">Save</a>
</div>

<div style="display: flex; align-items: center; gap: 16px">
<span class="d" style="width: 72px; height: 72px; border-radius: 36px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900">RS</span>
<button style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); font-size: 14px; font-weight: 700">Change photo</button>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ep-name" style="font-size: 13px; font-weight: 600; color: var(--muted)">Full name</label>
<input id="ep-name" value="Riya Sharma" style="height: 50px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 16px; font-weight: 600">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ep-disp" style="font-size: 13px; font-weight: 600; color: var(--muted)">Scoreboard name</label>
<input id="ep-disp" value="Riya S" style="height: 50px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 16px; font-weight: 600; min-width: 0">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ep-city" style="font-size: 13px; font-weight: 600; color: var(--muted)">City</label>
<input id="ep-city" value="Jaipur" style="height: 50px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 16px; font-weight: 600; min-width: 0">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ep-user" style="font-size: 13px; font-weight: 600; color: var(--muted)">Username</label>
<input id="ep-user" value="@riya.smash" style="height: 50px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 16px; font-weight: 600">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ep-bio" style="font-size: 13px; font-weight: 600; color: var(--muted)">Bio</label>
<textarea id="ep-bio" rows="2" style="padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; line-height: 22px">Left-handed. Doubles first. Mornings at Smash Arena.</textarea>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: var(--muted)">Sports I play</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(168,85,247,0.16); border: 1.5px solid #A855F7; font-size: 14px; font-weight: 700">Badminton</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--soft)">Table tennis</button>
<button aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(249,115,22,0.16); border: 1.5px solid #F97316; font-size: 14px; font-weight: 700">Pickleball</button>
<button aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 19px; background: rgba(6,182,212,0.14); border: 1.5px solid #06B6D4; font-size: 14px; font-weight: 700">Padel</button>
<button aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--soft)">Tennis</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

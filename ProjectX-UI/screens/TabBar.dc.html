<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--muted);text-decoration:none}a:hover{color: var(--fg)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<nav class="{{themeClass}}" aria-label="Main" style="width: 390px; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: var(--bar); border-top: 1px solid var(--line); font-family: 'Instrument Sans', system-ui, sans-serif">
<a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; height: 52px; justify-content: center; font-size: 11px; font-weight: 600; color: {{homeColor}}"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
<a href="TournamentList.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; height: 52px; justify-content: center; font-size: 11px; font-weight: 600; color: {{tourColor}}"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Tournaments</a>
<a href="NewMatchSport.dc.html" aria-label="New match" style="display: flex; align-items: center; justify-content: center; justify-self: center; width: 56px; height: 56px; border-radius: 18px; background: var(--primary); color: var(--onPrimary); box-shadow: 0 6px 20px rgba(0,0,0,0.45)"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="ChatList.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; height: 52px; justify-content: center; font-size: 11px; font-weight: 600; color: {{chatColor}}"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chats</a>
<a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; height: 52px; justify-content: center; font-size: 11px; font-weight: 600; color: {{profileColor}}"><svg class="i" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"active":{"editor":"enum","options":["home","tournaments","chats","profile","none"],"default":"home"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const on = 'var(--primary)', off = 'var(--muted)';
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',
      homeColor: a === 'home' ? on : off,
      tourColor: a === 'tournaments' ? on : off,
      chatColor: a === 'chats' ? on : off,
      profileColor: a === 'profile' ? on : off
    };
  }
}
</script>
</body>
</html>

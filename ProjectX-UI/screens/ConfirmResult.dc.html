<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm a result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;resize:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 32px; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="font-size: 17px; font-weight: 700">Confirm a result</span>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 24px; background: var(--av4); display: flex; align-items: center; justify-content: center; font-weight: 700">AT</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">Arjun T entered this result</span><span style="font-size: 13px; color: var(--muted)">Pickleball · Singles · played Sat 17 Oct</span></span>
</div>

<div style="border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(249,115,22,0.12)">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F97316"></span>Side-out · one game to 11</span>
<span style="padding: 3px 8px; border-radius: 6px; background: var(--warnBg); color: var(--warnText); font-size: 11px; font-weight: 800; letter-spacing: 0.06em">AWAITING YOU</span>
</div>
<div style="display: flex; align-items: center; padding: 16px; gap: 12px; border-bottom: 1px solid var(--raised)"><span style="width: 4px; height: 28px; border-radius: 2px; background: #F97316"></span><span style="flex: 1; font-weight: 700; font-size: 17px">Arjun T</span><span class="d" style="font-size: 44px; line-height: 44px; font-weight: 900">11</span></div>
<div style="display: flex; align-items: center; padding: 16px; gap: 12px"><span style="width: 4px; height: 28px"></span><span style="flex: 1; font-size: 17px; color: var(--soft)">You</span><span class="d" style="font-size: 44px; line-height: 44px; font-weight: 900; color: var(--muted)">9</span></div>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); font-size: 14px">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted); flex: none"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
<span style="flex: 1; color: var(--soft)">If you accept, your pickleball rating goes <b style="color: var(--fg)">1067 → 1055</b></span>
</div>

<div role="radiogroup" aria-label="Your answer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: var(--surface); gap: 4px">
<button role="radio" aria-checked="{{isAccept}}" onClick="{{setAccept}}" style="height: 44px; border-radius: 11px; font-size: 15px; font-weight: 700; background: {{acceptBg}}; color: {{acceptFg}}">That’s right</button>
<button role="radio" aria-checked="{{isDispute}}" onClick="{{setDispute}}" style="height: 44px; border-radius: 11px; font-size: 15px; font-weight: 700; background: {{disputeBg}}; color: {{disputeFg}}">That’s wrong</button>
</div>

<sc-if value="{{isDispute}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cr-note" style="font-size: 13px; font-weight: 600; color: var(--muted)">What happened? Arjun sees this.</label>
<textarea id="cr-note" rows="3" style="padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--primary); font-size: 15px; line-height: 22px">It was 11-9 to me. We switched sides at 6.</textarea>
<span style="font-size: 13px; color: var(--muted)">A disputed result doesn’t count in records or ratings.</span>
</div>
</sc-if>

<a href="MatchHistory.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{ctaBg}}; color: {{ctaFg}}; font-weight: 800; font-size: 16px">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'accept' }; }
  renderVals() {
    const acc = this.state.mode === 'accept';
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',
      isAccept: acc, isDispute: !acc,
      acceptBg: acc ? 'var(--primary)' : 'transparent', acceptFg: acc ? 'var(--onPrimary)' : 'var(--muted)',
      disputeBg: !acc ? '#FF5468' : 'transparent', disputeFg: !acc ? 'var(--onPrimary)' : 'var(--muted)',
      cta: acc ? 'Confirm result' : 'Send dispute',
      ctaBg: acc ? 'var(--primary)' : '#FF5468', ctaFg: 'var(--onPrimary)',
      setAccept: () => this.setState({ mode: 'accept' }),
      setDispute: () => this.setState({ mode: 'dispute' })
    };
  }
}
</script>
</body>
</html>

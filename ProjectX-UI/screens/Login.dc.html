<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 24px 36px; gap: 24px">

<a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>

<h1 class="d" style="margin: 0; font-size: 48px; line-height: 46px; font-weight: 900; text-transform: uppercase">Welcome back</h1>

<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: var(--surface); gap: 4px">
<button role="tab" aria-selected="{{isPass}}" onClick="{{showPass}}" style="height: 44px; border-radius: 11px; font-size: 15px; font-weight: 600; background: {{passBg}}; color: {{passFg}}">Password</button>
<button role="tab" aria-selected="{{isCode}}" onClick="{{showCode}}" style="height: 44px; border-radius: 11px; font-size: 15px; font-weight: 600; background: {{codeBg}}; color: {{codeFg}}">Text me a code</button>
</div>

<sc-if value="{{isPass}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="li-id" style="font-size: 13px; font-weight: 600; color: var(--muted)">Phone or username</label>
<input id="li-id" value="riya.smash" style="height: 56px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 16px; font-size: 17px; font-weight: 600">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="li-pass" style="font-size: 13px; font-weight: 600; color: var(--muted)">Password</label>
<input id="li-pass" type="password" value="smash2026!" style="height: 56px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--primary); padding: 0 16px; font-size: 17px; font-weight: 600; letter-spacing: 0.1em">
<a href="ForgotPassword.dc.html" style="align-self: flex-end; font-size: 14px; font-weight: 600; padding: 6px 0">Forgot password?</a>
</div>
</div>
</sc-if>
<sc-if value="{{isCode}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="li-phone" style="font-size: 13px; font-weight: 600; color: var(--muted)">Phone number</label>
<div style="display: flex; align-items: center; height: 56px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--primary); padding: 0 16px; gap: 12px">
<span style="font-weight: 600">+91</span><span style="width: 1px; height: 24px; background: var(--line)"></span>
<input id="li-phone" type="tel" value="98290 41567" style="flex: 1; font-size: 17px; font-weight: 600">
</div>
<span style="font-size: 13px; color: var(--muted)">We text a 6-digit code. No password needed.</span>
</div>
</sc-if>

<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">{{cta}}</a>

<div style="display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 13px"><span style="flex: 1; height: 1px; background: var(--line)"></span>or<span style="flex: 1; height: 1px; background: var(--line)"></span></div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; border: 1px solid var(--line2); font-weight: 600; font-size: 15px"><span style="width: 22px; height: 22px; border-radius: 11px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">G</span>Google</a>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; border: 1px solid var(--line2); font-weight: 600; font-size: 15px"><span style="width: 22px; height: 22px; border-radius: 11px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">A</span>Apple</a>
</div>
<p style="margin: -10px 0 0; font-size: 12px; line-height: 18px; color: var(--muted); text-align: center">Google and Apple work once linked in Settings.</p>

<div style="margin-top: auto; display: flex; justify-content: center; gap: 6px; font-size: 14px; color: var(--muted)">New here?<a href="SignupPhone.dc.html" style="font-weight: 700; color: var(--fg)">Create an account</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'pass' }; }
  renderVals() {
    const p = this.state.tab === 'pass';
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',
      isPass: p, isCode: !p,
      passBg: p ? 'var(--primary)' : 'transparent', passFg: p ? 'var(--onPrimary)' : 'var(--muted)',
      codeBg: !p ? 'var(--primary)' : 'transparent', codeFg: !p ? 'var(--onPrimary)' : 'var(--muted)',
      cta: p ? 'Log in' : 'Send code',
      showPass: () => this.setState({ tab: 'pass' }),
      showCode: () => this.setState({ tab: 'code' })
    };
  }
}
</script>
</body>
</html>

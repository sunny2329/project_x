<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 24px 36px; gap: 24px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="VerifyCode.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; gap: 6px" aria-label="Step 3 of 4">
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--line)"></span>
</div>
<span style="width: 44px"></span>
</div>

<div style="display: flex; align-items: center; gap: 16px">
<button aria-label="Add a photo" style="position: relative; width: 76px; height: 76px; border-radius: 38px; background: var(--raised); border: 1.5px dashed var(--line2); display: flex; align-items: center; justify-content: center; flex: none">
<svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
<span style="position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px; border-radius: 13px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M12 5v14M5 12h14"></path></svg></span>
</button>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 class="d" style="margin: 0; font-size: 40px; line-height: 40px; font-weight: 900; text-transform: uppercase">About you</h1>
<span style="font-size: 14px; color: var(--muted)">Photo is optional</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sd-name" style="font-size: 13px; font-weight: 600; color: var(--muted)">Full name</label>
<input id="sd-name" value="Riya Sharma" style="height: 56px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 16px; font-size: 17px; font-weight: 600">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sd-display" style="font-size: 13px; font-weight: 600; color: var(--muted)">Name on scoreboards</label>
<input id="sd-display" value="Riya S" style="height: 56px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 16px; font-size: 17px; font-weight: 600">
<span style="font-size: 13px; color: var(--muted)">Short works best. Others see this during live matches.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="sd-pass" style="font-size: 13px; font-weight: 600; color: var(--muted)">Password</label>
<div style="display: flex; align-items: center; height: 56px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--primary); padding: 0 6px 0 16px">
<input id="sd-pass" type="password" value="smash2026!" style="flex: 1; font-size: 17px; font-weight: 600; letter-spacing: 0.1em">
<button aria-label="Show password" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<span style="height: 4px; border-radius: 2px; background: #4ADE80"></span>
<span style="height: 4px; border-radius: 2px; background: #4ADE80"></span>
<span style="height: 4px; border-radius: 2px; background: #4ADE80"></span>
<span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
</div>
<span style="font-size: 13px; color: var(--muted)">Strong. At least 8 characters with a number.</span>
</div>
</div>

<div style="margin-top: auto">
<a href="PickSports.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Continue</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; justify-content: flex-end; gap: 8px">
<a href="EditProfile.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; font-size: 14px; font-weight: 700">Edit profile</a>
<a href="Settings.dc.html" aria-label="Settings" style="width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></a>
</div>

<div style="display: flex; align-items: center; gap: 16px">
<span class="d" style="width: 76px; height: 76px; border-radius: 38px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px #A855F7">RS</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="d" style="font-size: 34px; line-height: 34px; font-weight: 900; text-transform: uppercase">Riya Sharma</span>
<span style="font-size: 14px; color: var(--muted)">@riya.smash · Jaipur</span>
<span style="font-size: 14px; color: var(--soft)"><b>212</b> followers · <b>184</b> following</span>
</div>
</div>

<div role="tablist" style="display: flex; gap: 8px">
<button role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: 18px; background: #A855F7; color: var(--ink); font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px">Badminton</button>
<button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F97316"></span>Pickleball</button>
<button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #06B6D4"></span>Padel</button>
</div>

<div style="padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">RATING</span><span style="display: flex; align-items: baseline; gap: 8px"><span class="d" style="font-size: 52px; line-height: 50px; font-weight: 900">1138</span><span style="font-size: 14px; font-weight: 800; color: var(--good)">+138 since joining</span></span></div>
</div>
<svg width="318" height="72" viewBox="0 0 318 72" role="img" aria-label="Rating over the last 12 matches, from 1000 to 1138">
<line x1="0" y1="64" x2="318" y2="64" stroke="#27314A" stroke-width="1"/>
<line x1="0" y1="36" x2="318" y2="36" stroke="#1B2438" stroke-width="1"/>
<path d="M2 62 L30 58 L58 60 L86 50 L114 54 L142 44 L170 40 L198 46 L226 32 L254 28 L282 22 L314 10 L314 64 L2 64 Z" fill="rgba(168,85,247,0.16)"/>
<path d="M2 62 L30 58 L58 60 L86 50 L114 54 L142 44 L170 40 L198 46 L226 32 L254 28 L282 22 L314 10" fill="none" stroke="#C990FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="314" cy="10" r="4" fill="#C990FA"/>
</svg>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-top: 6px; border-top: 1px solid var(--raised)">
<span style="display: flex; flex-direction: column"><span class="d" style="font-size: 26px; font-weight: 900">48</span><span style="font-size: 12px; color: var(--muted)">Played</span></span>
<span style="display: flex; flex-direction: column"><span class="d" style="font-size: 26px; font-weight: 900">31</span><span style="font-size: 12px; color: var(--muted)">Won</span></span>
<span style="display: flex; flex-direction: column"><span class="d" style="font-size: 26px; font-weight: 900">17</span><span style="font-size: 12px; color: var(--muted)">Lost</span></span>
<span style="display: flex; flex-direction: column"><span class="d" style="font-size: 26px; font-weight: 900">65%</span><span style="font-size: 12px; color: var(--muted)">Win rate</span></span>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">RECENT MATCHES</span>
<a href="MatchHistory.dc.html" style="font-size: 14px; font-weight: 700; padding: 8px 0">See all</a>
</div>
<a href="MatchResult.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface)">
<span class="d" style="width: 32px; height: 32px; border-radius: 10px; background: rgba(74,222,128,0.16); color: var(--good); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900">W</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">with Kabir vs Arjun &amp; Meera</span><span style="font-size: 12px; color: var(--muted)">Today · Doubles</span></span>
<span class="d" style="font-size: 17px; font-weight: 800">21-17 18-21 21-19</span>
</a>
</div>
<dc-import name="TabBar" active="profile" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

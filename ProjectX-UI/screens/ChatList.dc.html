<!doctype html>
<html lang="en">
<head>

<style>

.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 16px">

<h1 class="d" style="margin: 0; font-size: 40px; font-weight: 900; text-transform: uppercase">Chats</h1>
<a href="Search.dc.html" aria-label="New chat" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--primary); color: var(--onPrimary)"><svg class="i" width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></a>

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 15px">Sunday Padel · 4</span><span style="font-size: 12px; color: var(--fg); font-weight: 700">9:42</span></span><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kabir: Court 3 booked for 7am</span><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FF5468; color: var(--ink); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span></span></span>
</a>
<a href="ChatThread.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 15px">Arjun T</span><span style="font-size: 12px; color: var(--fg); font-weight: 700">8:15</span></span><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rematch Thursday? I want that decider back</span><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FF5468; color: var(--ink); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span></span></span>
</a>
<a href="ChatThread.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0">

<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 15px">Jaipur Open · Staff</span><span style="font-size: 12px; color: var(--muted)">Yesterday</span></span><span style="font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">You: Draw is out, check court times</span></span>
</a>
<a href="ChatThread.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
<span style="width: 52px; height: 52px; flex: none; border-radius: 26px; background: var(--av5); display: flex; align-items: center; justify-content: center; font-weight: 700">IR</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 15px">Ishaan R</span><span style="font-size: 12px; color: var(--muted)">Mon</span></span><span style="font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Good game. That golden point though</span></span>
</a>
<a href="ChatThread.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
<span style="width: 52px; height: 52px; flex: none; border-radius: 26px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-weight: 700">MJ</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="display: flex; justify-content: space-between"><span style="font-weight: 700; font-size: 15px">Meera J</span><span style="font-size: 12px; color: var(--muted)">Sun</span></span><span style="font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Sent a match result</span></span>
</a>
</div>
</div>
<dc-import name="TabBar" active="chats" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }

</script>

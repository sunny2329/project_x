<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 0; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="OrgDashboard.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: var(--muted)">Kabir Memorial Cup</span><span class="d" style="font-size: 28px; line-height: 28px; font-weight: 900; text-transform: uppercase">Schedule</span></span>
<a href="CourtBoard.dc.html" style="height: 40px; padding: 0 12px; border-radius: 12px; background: var(--surface); display: flex; align-items: center; font-size: 13px; font-weight: 700">Court board</a>
</div>

<div style="display: flex; gap: 8px">
<button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; background: var(--primary); color: var(--onPrimary); font-size: 14px; font-weight: 700">Sat 15</button>
<button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); font-size: 14px; font-weight: 600">Sun 16</button>
<span style="margin-left: auto; align-self: center; font-size: 13px; color: var(--warnText); font-weight: 600">3 not scheduled</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">9:00 AM</span>
<a href="Fixture.dc.html" style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface)">
<span style="display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 10px; background: var(--raised)"><span style="font-size: 10px; color: var(--muted); font-weight: 700">COURT</span><span class="d" style="font-size: 24px; line-height: 24px; font-weight: 900">1</span></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; color: var(--muted)">Men’s Singles · R1-1</span><span style="font-size: 14px; font-weight: 600">Kabir M v Rohan S</span></span>
</a>
<a href="Fixture.dc.html" style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface)">
<span style="display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 10px; background: var(--raised)"><span style="font-size: 10px; color: var(--muted); font-weight: 700">COURT</span><span class="d" style="font-size: 24px; line-height: 24px; font-weight: 900">2</span></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; color: var(--muted)">Men’s Singles · R1-2</span><span style="font-size: 14px; font-weight: 600">Meet K v Kavya R</span></span>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted)">9:40 AM</span>
<a href="Fixture.dc.html" style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--surface)">
<span style="display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 10px; background: var(--raised)"><span style="font-size: 10px; color: var(--muted); font-weight: 700">COURT</span><span class="d" style="font-size: 24px; line-height: 24px; font-weight: 900">3</span></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; color: var(--muted)">Mixed Doubles · Group A</span><span style="font-size: 14px; font-weight: 600">Neha / Ishaan v Sara / Aarav</span></span>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--warnText)">NOT SCHEDULED</span>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; border: 1px dashed var(--warnLine)">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">Men’s Singles · R1-3</span><span style="font-size: 14px; font-weight: 600">Arjun T v Sara P</span></span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 40px; border-radius: 10px; background: var(--raised); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M12 5v14"/></svg>Pick court</button>
<button style="height: 40px; border-radius: 10px; background: var(--raised); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Pick time</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

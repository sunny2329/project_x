<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 24px 36px; gap: 28px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; gap: 6px" aria-label="Step 1 of 4">
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--line)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--line)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--line)"></span>
</div>
<span style="width: 44px"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="d" style="margin: 0; font-size: 44px; line-height: 44px; font-weight: 900; text-transform: uppercase">Create your account</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Your phone number is your login. We text you a code to check it’s yours.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-phone" style="font-size: 13px; font-weight: 600; color: var(--muted)">Phone number</label>
<div style="display: flex; align-items: center; height: 56px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--primary); padding: 0 16px; gap: 12px">
<span style="font-weight: 600">+91</span>
<span style="width: 1px; height: 24px; background: var(--line)"></span>
<input id="su-phone" type="tel" value="98290 41567" style="flex: 1; font-size: 17px; font-weight: 600; letter-spacing: 0.02em">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="su-user" style="font-size: 13px; font-weight: 600; color: var(--muted)">Username</label>
<div style="display: flex; align-items: center; height: 56px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 16px; gap: 8px">
<span style="color: var(--faint); font-weight: 600">@</span>
<input id="su-user" type="text" value="riya.smash" style="flex: 1; font-size: 17px; font-weight: 600">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--good); stroke-width: 2.4"><path d="M5 12l5 5 9-10"></path></svg>
</div>
<span style="font-size: 13px; color: var(--good)">@riya.smash is free</span>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
<p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--muted); text-align: center">By continuing you agree to the Terms and Privacy Policy.</p>
<a href="VerifyCode.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Send code</a>
<div style="display: flex; justify-content: center; gap: 6px; font-size: 14px; color: var(--muted)">Already have an account?<a href="Login.dc.html" style="font-weight: 700; color: var(--fg)">Log in</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

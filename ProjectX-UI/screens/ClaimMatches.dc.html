<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim guest matches</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input[type=checkbox]{width:22px;height:22px;accent-color: var(--fg);margin:0}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 64px 24px 36px; gap: 24px">

<div style="width: 64px; height: 64px; border-radius: 20px; background: var(--raised); display: flex; align-items: center; justify-content: center; color: var(--fg)">
<svg class="i" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"></path></svg>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="d" style="margin: 0; font-size: 44px; line-height: 44px; font-weight: 900; text-transform: uppercase">You’ve already played 3 matches</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Friends scored these with you as a guest, using your phone number. Add them to build your record.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="cl-1" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)">
<input id="cl-1" type="checkbox" checked="">
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A855F7"></span>Badminton · 12 Oct · scored by Kabir M</span>
<span style="font-size: 15px; font-weight: 600">Won vs Arjun T</span>
<span class="d" style="font-size: 18px; font-weight: 800; letter-spacing: 0.02em">21-17, 18-21, 21-19</span>
</span>
</label>
<label for="cl-2" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)">
<input id="cl-2" type="checkbox" checked="">
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F97316"></span>Pickleball · 5 Oct · scored by Meera J</span>
<span style="font-size: 15px; font-weight: 600">Lost with Meera J</span>
<span class="d" style="font-size: 18px; font-weight: 800; letter-spacing: 0.02em">9-11</span>
</span>
</label>
<label for="cl-3" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line)">
<input id="cl-3" type="checkbox" checked="">
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A855F7"></span>Badminton · 28 Sep · scored by Kabir M</span>
<span style="font-size: 15px; font-weight: 600">Won vs Dev P</span>
<span class="d" style="font-size: 18px; font-weight: 800; letter-spacing: 0.02em">21-15, 21-12</span>
</span>
</label>
</div>

<p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--muted)">Matches played as a guest count in your record but don’t change your rating.</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Add 3 matches to my profile</a>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 600; color: var(--muted)">These aren’t mine</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

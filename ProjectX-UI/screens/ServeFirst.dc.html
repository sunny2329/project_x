<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who serves first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 32px; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="NewMatchSetup.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<button style="height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line2); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/></svg>Toss a coin</button>
</div>

<h1 class="d" style="margin: 0; font-size: 44px; line-height: 42px; font-weight: 900; text-transform: uppercase">Who serves first?</h1>

<div style="position: relative; height: 300px; border-radius: 18px; background: #0F2A24; border: 2px solid #E8F0EC; overflow: hidden">
<span style="position: absolute; left: 0; right: 0; top: 149px; height: 2px; background: #E8F0EC"></span>
<span style="position: absolute; left: 0; right: 0; top: 104px; height: 1px; background: rgba(232,240,236,0.6)"></span>
<span style="position: absolute; left: 0; right: 0; top: 196px; height: 1px; background: rgba(232,240,236,0.6)"></span>
<span style="position: absolute; left: 50%; top: 0; height: 104px; width: 1px; background: rgba(232,240,236,0.6)"></span>
<span style="position: absolute; left: 50%; top: 196px; bottom: 0; width: 1px; background: rgba(232,240,236,0.6)"></span>
<span style="position: absolute; left: 50%; top: 141px; transform: translateX(-50%); padding: 2px 8px; border-radius: 6px; background: var(--bg); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted)">NET</span>
<button onClick="{{pickA}}" aria-pressed="{{aOn}}" style="position: absolute; left: 12px; right: 12px; top: 12px; height: 80px; border-radius: 14px; background: {{aBg}}; border: {{aBorder}}; display: flex; align-items: center; justify-content: space-around; font-weight: 700; font-size: 15px">
<span style="display: flex; align-items: center; gap: 6px">Kabir M</span>
<span style="display: flex; align-items: center; gap: 6px"><sc-if value="{{aOn}}" hint-placeholder-val="{{true}}"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--primary); box-shadow: 0 0 0 4px rgba(245,247,251,0.25)"></span></sc-if>Riya S</span>
</button>
<button onClick="{{pickB}}" aria-pressed="{{bOn}}" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 80px; border-radius: 14px; background: {{bBg}}; border: {{bBorder}}; display: flex; align-items: center; justify-content: space-around; font-weight: 700; font-size: 15px">
<span style="display: flex; align-items: center; gap: 6px"><sc-if value="{{bOn}}" hint-placeholder-val="{{false}}"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--primary); box-shadow: 0 0 0 4px rgba(245,247,251,0.25)"></span></sc-if>Arjun T</span>
<span>Meera J</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Serving first for {{sideName}}</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button aria-pressed="true" style="height: 50px; border-radius: 14px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 15px">{{p1}}</button>
<button aria-pressed="false" style="height: 50px; border-radius: 14px; border: 1px solid var(--line2); font-weight: 600; font-size: 15px">{{p2}}</button>
</div>
<span style="font-size: 13px; color: var(--muted)">At 0-0 the server starts in the right court. The app tracks it from here.</span>
</div>

<a href="ScoreBadminton.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 18px; background: #A855F7; color: var(--ink); font-weight: 800; font-size: 17px">Start match</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { side: 'A' }; }
  renderVals() {
    const a = this.state.side === 'A';
    const on = 'rgba(168,85,247,0.28)', off = 'rgba(10,10,10,0.55)';
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',
      aOn: a, bOn: !a,
      aBg: a ? on : off, bBg: !a ? on : off,
      aBorder: a ? '2px solid #A855F7' : '1px solid rgba(232,240,236,0.3)',
      bBorder: !a ? '2px solid #A855F7' : '1px solid rgba(232,240,236,0.3)',
      sideName: a ? 'Riya & Kabir' : 'Arjun & Meera',
      p1: a ? 'Riya S' : 'Arjun T', p2: a ? 'Kabir M' : 'Meera J',
      pickA: () => this.setState({ side: 'A' }),
      pickB: () => this.setState({ side: 'B' })
    };
  }
}
</script>
</body>
</html>

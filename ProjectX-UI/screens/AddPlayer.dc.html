<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add player or guest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--scrim); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative">

<a href="NewMatchSetup.dc.html" aria-label="Close" style="position: absolute; inset: 0 0 auto 0; height: 120px"></a>

<div style="height: 740px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: var(--surface); padding: 10px 20px 32px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line2)"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Add to side B</h2>
<a href="NewMatchSetup.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: var(--raised); display: flex; align-items: center; justify-content: center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
</div>

<div style="display: flex; align-items: center; gap: 10px; height: 48px; border-radius: 14px; background: var(--bg); border: 1.5px solid var(--primary); padding: 0 14px">
<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
<label for="ap-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search players</label>
<input id="ap-q" value="mee" style="flex: 1; font-size: 16px">
</div>

<div style="display: flex; flex-direction: column">
<a href="NewMatchSetup.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
<span style="width: 44px; height: 44px; border-radius: 22px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">MK</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Meet Kapoor</span><span style="font-size: 13px; color: var(--muted)">@meetk · Badminton 1098</span></span>
<span style="height: 34px; padding: 0 14px; border-radius: 10px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 14px; display: flex; align-items: center">Add</span>
</a>
<a href="NewMatchSetup.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
<span style="width: 44px; height: 44px; border-radius: 22px; background: var(--av3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">MR</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Meenal Rao</span><span style="font-size: 13px; color: var(--muted)">@meenal · Badminton 1211</span></span>
<span style="height: 34px; padding: 0 14px; border-radius: 10px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 14px; display: flex; align-items: center">Add</span>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line)">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px">Not on ProjectX? Add a guest</span>
<span style="font-size: 13px; line-height: 19px; color: var(--muted)">Add their number and the match moves to their profile when they join.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ap-gn" style="font-size: 13px; font-weight: 600; color: var(--muted)">Name</label>
<input id="ap-gn" value="Meera J" style="height: 48px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 16px; font-weight: 600">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ap-gp" style="font-size: 13px; font-weight: 600; color: var(--muted)">Phone (optional)</label>
<input id="ap-gp" type="tel" value="+91 99280 11223" style="height: 48px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); padding: 0 14px; font-size: 16px; font-weight: 600">
</div>
<a href="NewMatchSetup.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 15px">Add Meera as a guest</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

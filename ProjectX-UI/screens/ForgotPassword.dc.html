<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 24px 36px; gap: 22px">

<a href="Login.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="d" style="margin: 0; font-size: 44px; line-height: 44px; font-weight: 900; text-transform: uppercase">Reset your password</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">We texted a code to <b style="color: var(--fg)">+91 98290 41567</b>.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="fp-code" style="font-size: 13px; font-weight: 600; color: var(--muted)">6-digit code</label>
<input id="fp-code" value="719 305" class="d" style="height: 60px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 16px; font-size: 30px; font-weight: 800; letter-spacing: 0.3em">
<span style="font-size: 13px; color: var(--muted)">Didn’t get it? Resend in 0:31</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="fp-new" style="font-size: 13px; font-weight: 600; color: var(--muted)">New password</label>
<input id="fp-new" type="password" value="rallyhard2026" style="height: 56px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--primary); padding: 0 16px; font-size: 17px; font-weight: 600; letter-spacing: 0.1em">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="fp-again" style="font-size: 13px; font-weight: 600; color: var(--muted)">Type it again</label>
<input id="fp-again" type="password" value="rallyhard2026" style="height: 56px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 0 16px; font-size: 17px; font-weight: 600; letter-spacing: 0.1em">
</div>

<div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--warnBg); color: var(--warnText); font-size: 13px; line-height: 19px">
<svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span>For safety, this signs you out on every phone. Log in again with the new password.</span>
</div>

<div style="margin-top: auto">
<a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Reset password</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

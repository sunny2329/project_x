<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New match · rules and players</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input[type=radio]{accent-color:#A855F7;width:20px;height:20px;margin:0}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 32px; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="NewMatchSport.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #A855F7"></span><span class="d" style="font-size: 28px; font-weight: 900; text-transform: uppercase">Badminton</span></span>
</div>

<div role="radiogroup" aria-label="Format" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 14px; background: var(--surface); gap: 4px">
<button role="radio" aria-checked="false" style="height: 42px; border-radius: 11px; font-size: 15px; font-weight: 600; color: var(--muted); text-align: center">Singles</button>
<button role="radio" aria-checked="true" style="height: 42px; border-radius: 11px; font-size: 15px; font-weight: 700; background: #A855F7; color: var(--ink); text-align: center">Doubles</button>
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px">Rules</legend>
<label for="rs-1" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(168,85,247,0.12); border: 1.5px solid #A855F7">
<input id="rs-1" type="radio" name="rs" checked>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Best of 3 · 21 points</span><span style="font-size: 13px; color: var(--soft)">Win by 2, capped at 30 · BWF</span></span>
</label>
<label for="rs-2" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line)">
<input id="rs-2" type="radio" name="rs">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">One game · 21 points</span><span style="font-size: 13px; color: var(--muted)">Cap 30</span></span>
</label>
<label for="rs-3" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line)">
<input id="rs-3" type="radio" name="rs">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">Best of 3 · 15 points</span><span style="font-size: 13px; color: var(--muted)">Win by 2, cap 21</span></span>
</label>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Players</span>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: center; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line)">
<span style="font-size: 11px; font-weight: 700; color: var(--tBad); letter-spacing: 0.06em">SIDE A</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 14px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-size: 11px">RS</span>You</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 14px; background: var(--av1); display: flex; align-items: center; justify-content: center; font-size: 11px">KM</span>Kabir M</span>
</div>
<span class="d" style="text-align: center; font-size: 18px; color: var(--muted)">VS</span>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line)">
<span style="font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em">SIDE B</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 14px; background: var(--av4); display: flex; align-items: center; justify-content: center; font-size: 11px">AT</span>Arjun T</span>
<a href="AddPlayer.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; font-size: 14px; font-weight: 700; color: var(--fg)"><span style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px dashed var(--faint); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.6"><path d="M12 5v14M5 12h14"/></svg></span>Add player</a>
</div>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: var(--muted); text-align: center">Add one more player to start</span>
<a href="ServeFirst.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Next: who serves first</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

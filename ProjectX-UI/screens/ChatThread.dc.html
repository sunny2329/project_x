<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input{font:inherit;color:inherit;background:transparent;border:0;outline:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 54px 16px 12px; border-bottom: 1px solid var(--raised)">
<a href="ChatList.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<a href="PlayerProfile.dc.html" style="flex: 1; display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: var(--av4); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">AT</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 15px">Arjun T</span><span style="font-size: 12px; color: var(--muted)">Badminton 1142 · Pickleball 1067</span></span>
</a>
<a href="NewMatchSport.dc.html" aria-label="Start a match with Arjun" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
<span style="align-self: center; font-size: 12px; color: var(--muted); padding: 4px 0">Sunday</span>
<a href="MatchResult.dc.html" style="align-self: flex-end; width: 250px; box-sizing: border-box; padding: 12px; border-radius: 16px 16px 4px 16px; background: var(--raised); border: 1px solid var(--line2); display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #A855F7"></span>Badminton · Singles</span>
<span style="display: flex; justify-content: space-between; font-weight: 700"><span>Riya S</span><span class="d" style="font-size: 18px">21 18 21</span></span>
<span style="display: flex; justify-content: space-between; color: var(--muted)"><span>Arjun T</span><span class="d" style="font-size: 18px">17 21 19</span></span>
</a>
<span style="align-self: flex-start; max-width: 260px; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--surface); font-size: 15px; line-height: 21px">That third game was unreal. 19-all and you hit the line twice.</span>
<span style="align-self: flex-start; max-width: 260px; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--surface); font-size: 15px; line-height: 21px">Rematch Thursday? I want that decider back</span>
<span style="align-self: flex-end; max-width: 260px; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: var(--primary); color: var(--onPrimary); font-size: 15px; line-height: 21px">Thursday 7pm, Smash Arena. Bring your best.</span>
<span style="align-self: flex-end; font-size: 11px; color: var(--muted)">Seen 8:16</span>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 30px; border-top: 1px solid var(--raised); background: var(--bar)">
<label for="ct-m" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</label>
<input id="ct-m" placeholder="Message" style="flex: 1; height: 46px; padding: 0 16px; border-radius: 23px; background: var(--surface); border: 1px solid var(--line); font-size: 15px">
<button aria-label="Send" style="width: 46px; height: 46px; border-radius: 23px; background: var(--primary); color: var(--onPrimary); display: flex; align-items: center; justify-content: center"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7z"/></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line2);position:relative;margin:0;cursor:pointer}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--fg);transition:left .15s}
input[type=checkbox]:checked{background:#4ADE80}
input[type=checkbox]:checked::after{left:23px;background:var(--bg)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 28px; gap: 16px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
<h1 class="d" style="margin: 0; font-size: 32px; font-weight: 900; text-transform: uppercase">Settings</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); padding-left: 4px">ACCOUNT</span>
<div style="border-radius: 16px; background: var(--surface); overflow: hidden">
<div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-bottom: 1px solid var(--raised)"><span style="flex: 1; font-size: 15px">Phone</span><span style="font-size: 14px; color: var(--muted)">+91 98290 41567</span></div>
<a href="ForgotPassword.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-bottom: 1px solid var(--raised)"><span style="flex: 1; font-size: 15px">Change password</span><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted)"><path d="M9 6l6 6-6 6"/></svg></a>
<div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-bottom: 1px solid var(--raised)"><span style="flex: 1; font-size: 15px">Google</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--good); font-weight: 600"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Linked</span></div>
<div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px"><span style="flex: 1; font-size: 15px">Apple</span><button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); font-size: 14px; font-weight: 700">Link</button></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); padding-left: 4px">DEVICES</span>
<div style="border-radius: 16px; background: var(--surface); overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border-bottom: 1px solid var(--raised)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">Pixel 8 · this phone</span><span style="font-size: 12px; color: var(--muted)">Jaipur · active now</span></span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border-bottom: 1px solid var(--raised)"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px">iPad</span><span style="font-size: 12px; color: var(--muted)">Last used 3 days ago</span></span></div>
<button style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; width: 100%; font-size: 15px; font-weight: 600; color: var(--bad)">Sign out other devices</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); padding-left: 4px">WHILE SCORING</span>
<div style="border-radius: 16px; background: var(--surface); overflow: hidden">
<label for="st-awake" style="display: flex; align-items: center; min-height: 56px; padding: 0 16px; border-bottom: 1px solid var(--raised)"><span style="flex: 1; font-size: 15px">Keep screen on</span><input id="st-awake" type="checkbox" checked></label>
<label for="st-haptic" style="display: flex; align-items: center; min-height: 56px; padding: 0 16px"><span style="flex: 1; font-size: 15px">Vibrate on each point</span><input id="st-haptic" type="checkbox" checked></label>
</div>
</div>

<a href="Welcome.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: var(--surface); font-weight: 700; font-size: 15px; color: var(--bad)">Log out</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your sports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 24px 36px; gap: 24px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="SignupDetails.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: var(--surface)"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display: flex; gap: 6px" aria-label="Step 4 of 4">
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: var(--primary)"></span>
</div>
<span style="width: 44px"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="d" style="margin: 0; font-size: 44px; line-height: 44px; font-weight: 900; text-transform: uppercase">What do you play?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted)">Pick any. You get a rating for each sport, starting at 1000.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button onClick="{{t.badminton.toggle}}" aria-pressed="{{t.badminton.on}}" style="position: relative; height: 118px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.badminton.bg}}; border: {{t.badminton.border}}; display: flex; flex-direction: column; justify-content: space-between">
<svg class="i" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color: #A855F7"><circle cx="12" cy="18" r="3"></circle><path d="M10 15.5 7 4M14 15.5 17 4M12 15V4M7 4h10"></path></svg>
<span style="font-size: 17px; font-weight: 700">Badminton</span>
<sc-if value="{{t.badminton.on}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; background: #A855F7; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
</button>
<button onClick="{{t.tt.toggle}}" aria-pressed="{{t.tt.on}}" style="position: relative; height: 118px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.tt.bg}}; border: {{t.tt.border}}; display: flex; flex-direction: column; justify-content: space-between">
<svg class="i" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color: #EAB308"><circle cx="10" cy="10" r="6"></circle><path d="m14.5 14.5 5 5"></path><circle cx="19" cy="5" r="1.5"></circle></svg>
<span style="font-size: 17px; font-weight: 700">Table tennis</span>
<sc-if value="{{t.tt.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; background: #EAB308; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
</button>
<button onClick="{{t.pickle.toggle}}" aria-pressed="{{t.pickle.on}}" style="position: relative; height: 118px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.pickle.bg}}; border: {{t.pickle.border}}; display: flex; flex-direction: column; justify-content: space-between">
<svg class="i" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color: #F97316"><circle cx="12" cy="12" r="8"></circle><circle cx="9" cy="9" r="1"></circle><circle cx="15" cy="10" r="1"></circle><circle cx="11" cy="15" r="1"></circle><circle cx="15.5" cy="15" r="1"></circle></svg>
<span style="font-size: 17px; font-weight: 700">Pickleball</span>
<sc-if value="{{t.pickle.on}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; background: #F97316; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
</button>
<button onClick="{{t.padel.toggle}}" aria-pressed="{{t.padel.on}}" style="position: relative; height: 118px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.padel.bg}}; border: {{t.padel.border}}; display: flex; flex-direction: column; justify-content: space-between">
<svg class="i" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color: #06B6D4"><rect x="6" y="2" width="12" height="13" rx="6"></rect><path d="M12 15v7"></path><circle cx="10" cy="7" r=".8"></circle><circle cx="14" cy="7" r=".8"></circle><circle cx="12" cy="10" r=".8"></circle></svg>
<span style="font-size: 17px; font-weight: 700">Padel</span>
<sc-if value="{{t.padel.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; background: #06B6D4; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
</button>
<button onClick="{{t.tennis.toggle}}" aria-pressed="{{t.tennis.on}}" style="position: relative; height: 118px; box-sizing: border-box; padding: 16px; border-radius: 20px; background: {{t.tennis.bg}}; border: {{t.tennis.border}}; display: flex; flex-direction: column; justify-content: space-between">
<svg class="i" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="color: #84CC16"><circle cx="12" cy="12" r="8"></circle><path d="M5 7c4 2 4 8 0 10M19 7c-4 2-4 8 0 10"></path></svg>
<span style="font-size: 17px; font-weight: 700">Tennis</span>
<sc-if value="{{t.tennis.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 12px; background: #84CC16; color: var(--ink); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
</button>
<div style="height: 118px; box-sizing: border-box; padding: 16px; border-radius: 20px; border: 1px dashed var(--line); display: flex; flex-direction: column; justify-content: space-between; color: var(--muted)">
<svg class="i" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4c-1 4 0 8 4 10M4.5 9c4-1 7 1 8 4M8 19c2-3 5-5 11-4"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Volleyball</span><span style="font-size: 12px">Coming soon</span></span>
</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="ClaimMatches.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 16px">Continue · {{count}} selected</a>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 600; color: var(--muted)">Skip for now</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { badminton: true, tt: false, pickle: true, padel: false, tennis: false }; }
  renderVals() {
    const tint = { badminton: '168,85,247', tt: '234,179,8', pickle: '249,115,22', padel: '6,182,212', tennis: '132,204,22' };
    const hex = { badminton: '#A855F7', tt: '#EAB308', pickle: '#F97316', padel: '#06B6D4', tennis: '#84CC16' };
    const t = {};
    let count = 0;
    Object.keys(tint).forEach((k) => {
      const on = !!this.state[k];
      if (on) count++;
      t[k] = {
        on,
        bg: on ? 'rgba(' + tint[k] + ',0.14)' : 'var(--surface)',
        border: on ? '2px solid ' + hex[k] : '1px solid var(--line)',
        toggle: () => this.setState({ [k]: !this.state[k] })
      };
    });
    return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk', t, count };
  }
}
</script>
</body>
</html>

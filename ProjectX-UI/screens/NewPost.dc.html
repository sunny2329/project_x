<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
:root,.dk{--bg:#0A0A0A;--surface:#161412;--raised:#221F1C;--raised2:#1B1917;--bar:#0F0E0D;--scrim:#000000;--line:#2C2825;--line2:#3F3A35;--fg:#F6F2EE;--soft:#D8D1CA;--muted:#ABA39B;--faint:#7D756E;--primary:#E85D04;--onPrimary:#0A0A0A;--accentText:#FF8A3D;--accentDeep:#1F1209;--accentLine:#5C2F10;--accentTint:rgba(232,93,4,0.14);--sideB:#F2EDE7;--onBrightMuted:#4A433D;--ink:#0A0A0A;--warnBg:#2A2113;--warnText:#FFD58A;--warnLine:#5C4A24;--good:#4ADE80;--bad:#FF8A98;--tBad:#C990FA;--tTT:#F2CC4D;--tPk:#FDA668;--tPd:#5FD4E8;--tTn:#B5E26A;--tVb:#5EDBC8;--av1:#3B2A55;--av2:#4A2433;--av3:#173A43;--av4:#3D2A17;--av5:#26361A}
.lt{--bg:#FFFFFF;--surface:#F7F3EF;--raised:#EEE8E2;--raised2:#F2EDE8;--bar:#FFFFFF;--scrim:#CFC7BF;--line:#E6DED6;--line2:#D2C8BE;--fg:#16120F;--soft:#3B3430;--muted:#6B625B;--faint:#978D85;--primary:#C2410C;--onPrimary:#FFFFFF;--accentText:#C2410C;--accentDeep:#FFF1E7;--accentLine:#F8C6A3;--accentTint:rgba(234,88,12,0.10);--sideB:#1C1917;--onBrightMuted:rgba(255,255,255,0.8);--ink:#0A0A0A;--warnBg:#FEF3C7;--warnText:#92400E;--warnLine:#E9C46A;--good:#15803D;--bad:#BE123C;--tBad:#7E22CE;--tTT:#A16207;--tPk:#C2410C;--tPd:#0E7490;--tTn:#4D7C0F;--tVb:#0F766E;--av1:#EBD9FF;--av2:#FCE1EA;--av3:#CDF3F8;--av4:#FFE6CC;--av5:#E3F5C8}

a{color:var(--fg);text-decoration:none}a:hover{color:var(--fg)}
.d{font-family:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;resize:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 54px 20px 28px; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Home.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 16px; font-weight: 600; color: var(--muted)">Cancel</a>
<span style="font-size: 17px; font-weight: 700">New post</span>
<a href="Home.dc.html" style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 12px; background: var(--primary); color: var(--onPrimary); font-weight: 700; font-size: 15px">Post</a>
</div>

<div style="display: flex; gap: 12px">
<span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: var(--av2); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">RS</span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<label for="np-text" style="font-size: 14px; font-weight: 600">Riya S</label>
<textarea id="np-text" rows="4" style="font-size: 17px; line-height: 25px">Came back from 11-18 down in the decider. Never stop chasing the shuttle.</textarea>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-left: 52px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="position: relative; height: 140px; border-radius: 14px; background: repeating-linear-gradient(135deg, var(--raised) 0 10px, var(--raised2) 10px 20px); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted)">[Photo 1]
<button aria-label="Remove photo" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 14px; background: rgba(10,15,28,0.8); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div style="position: relative; height: 140px; border-radius: 14px; background: repeating-linear-gradient(135deg, var(--raised) 0 10px, var(--raised2) 10px 20px); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted)">[Photo 2]
<button aria-label="Remove photo" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 14px; background: rgba(10,15,28,0.8); display: flex; align-items: center; justify-content: center"><svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; border: 1px solid var(--line)">
<span style="width: 4px; height: 36px; border-radius: 2px; background: #A855F7"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: var(--muted)">Attached match · Badminton</span><span class="d" style="font-size: 18px; font-weight: 800">Won 21-17, 18-21, 21-19</span></span>
<button aria-label="Remove match" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--muted)"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
</div>

<div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid var(--raised)">
<button style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 600"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>Photo</button>
<button style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 600"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>Match</button>
<span style="margin-left: auto; font-size: 13px; color: var(--muted)">Followers</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.theme ?? 'dark') === 'light' ? 'lt' : 'dk',}; }
}
</script>
</body>
</html>
